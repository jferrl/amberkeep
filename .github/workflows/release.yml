name: Release

# Runs when a version tag is pushed. The tag must point at a commit CI has already
# passed on: this builds and publishes, it does not decide whether the code is good.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      # Cheap insurance. A tag can be pushed at anything, and a release nobody can
      # run is worse than no release.
      - name: Test
        run: go test ./... -count=1
        env:
          CGO_ENABLED: 0

  cli:
    name: Command line
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Build every platform
        # One static binary per platform, cross-compiled from one machine because
        # nothing here needs a C toolchain. -trimpath keeps build paths out of the
        # binary, so the same source at the same version produces the same bytes
        # wherever it is built.
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist

          for target in darwin/arm64 darwin/amd64 windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="amberkeep"
            [ "$os" = "windows" ] && name="amberkeep.exe"

            echo "building $target"
            mkdir -p "build/$os-$arch"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=$version" \
              -o "build/$os-$arch/$name" ./cmd/amberkeep

            cp LICENSE README.md "build/$os-$arch/"

            if [ "$os" = "windows" ]; then
              (cd "build/$os-$arch" && zip -qr "../../dist/amberkeep_${version}_${os}_${arch}.zip" .)
            else
              tar -czf "dist/amberkeep_${version}_${os}_${arch}.tar.gz" -C "build/$os-$arch" .
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: dist/
          retention-days: 1

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: verify
    # Built on the platform it runs on. Wails needs cgo on macOS, and an .app bundle
    # can only be assembled and turned into a disk image by macOS itself. Windows
    # needs no cgo but is built on Windows anyway, so that what ships is what a
    # Windows machine produced rather than what a Mac guessed it would.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      # Only for the icon: the mark is rendered from the brand SVGs rather than
      # committed as a binary, and rendering needs the browser the frontend already
      # depends on. The pages themselves are committed at internal/viewer/dist.
      - uses: actions/setup-node@v6
        if: matrix.os == 'macos-latest'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install what renders the icon
        if: matrix.os == 'macos-latest'
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Signing is wired up and dormant. With no secrets set this does nothing and
      # the release is unsigned exactly as before; the day a certificate exists,
      # adding the secrets is the whole change. Written now because the alternative
      # is writing it under time pressure on the day somebody pays for one.
      - name: Take up the signing identity
        id: identity
        if: matrix.os == 'macos-latest'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CERTIFICATE:-}" ]; then
            echo "signing: no certificate configured, the application will be unsigned" >&2
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A keychain of its own, unlocked only for this run. The runner is
          # discarded afterwards, but a certificate in the login keychain is a
          # certificate every later step can use.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          transient="$(openssl rand -base64 24)"
          security create-keychain -p "$transient" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$transient" "$keychain"

          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$transient" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"

          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the application
        env:
          SIGNING_IDENTITY: ${{ steps.identity.outputs.signed == 'true' && secrets.MACOS_SIGNING_IDENTITY || '' }}
          # An App Store Connect key rather than an Apple ID and an app-specific
          # password: it is revocable on its own and is not somebody's account.
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist

          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            ./desktop/build/bundle.sh "$PWD/Amberkeep.app"

            # Over the ad-hoc signature the bundle script applies. The hardened
            # runtime is not optional: notarisation refuses a bundle without it.
            if [ -n "${SIGNING_IDENTITY:-}" ]; then
              codesign --force --deep --timestamp --options runtime \
                --sign "$SIGNING_IDENTITY" Amberkeep.app
              codesign --verify --deep --strict --verbose=2 Amberkeep.app
            fi

            # A disk image is how a Mac application is handed over, and the symlink
            # is the drag-to-install everybody expects to find inside one.
            staging="$(mktemp -d)"
            cp -R Amberkeep.app "$staging/"
            ln -s /Applications "$staging/Applications"
            cp LICENSE "$staging/"
            hdiutil create -volname Amberkeep -srcfolder "$staging" -ov -format UDZO \
              "dist/Amberkeep_${version}_macos.dmg"

            # Notarisation is what actually removes the warning, and stapling is what
            # makes the result work on a machine that is offline when it first opens
            # the disk image.
            if [ -n "${SIGNING_IDENTITY:-}" ] && [ -n "${ASC_KEY_ID:-}" ]; then
              printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
              xcrun notarytool submit "dist/Amberkeep_${version}_macos.dmg" \
                --key "$RUNNER_TEMP/asc.p8" --key-id "$ASC_KEY_ID" \
                --issuer "$ASC_ISSUER_ID" --wait
              xcrun stapler staple "dist/Amberkeep_${version}_macos.dmg"
              rm -f "$RUNNER_TEMP/asc.p8"
            fi
          else
            mkdir -p build/windows
            # No cgo: Wails reaches Windows through WebView2 with pure Go bindings.
            CGO_ENABLED=0 go build -C desktop -tags desktop,production -trimpath \
              -ldflags "-s -w -H windowsgui" -o "$PWD/build/windows/Amberkeep.exe" ./...
            cp LICENSE README.md build/windows/
            (cd build/windows && 7z a -tzip "../../dist/Amberkeep_${version}_windows_amd64.zip" .)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist/
          retention-days: 1

  publish:
    name: Publish
    needs: [cli, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          path: staged
      - name: Gather
        run: |
          mkdir -p dist
          find staged -type f -exec cp {} dist/ \;
          ls -la dist

      - name: Checksums
        # The only integrity story an unsigned binary has. Somebody who cares can
        # check what they downloaded is what was built.
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes-file .github/RELEASE_NOTES.md \
            --verify-tag
