name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: Build
        run: go build ./...
        env:
          CGO_ENABLED: 0
      - name: Test with race detector
        run: go test ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic
      - name: Enforce coverage gate
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t + 0 < 85) { print "coverage " t "% is below the 85% gate"; exit 1 } }'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned rather than "latest", and to the version a laptop has, because a
          # linter that disagrees with the one people run locally teaches them to
          # stop trusting a clean local run. Raise it deliberately, and fix whatever
          # the new release finds in the same change.
          #
          # v6 of the action installs the v1 line, which is built with an older Go
          # than this module targets and refuses to read a v2 configuration at all.
          version: v2.13.2
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      # A short run on every change catches regressions in the parsers that read
      # untrusted files. Long campaigns run separately.
      - run: go test ./internal/crypt15/ -run=XXX -fuzz=FuzzDecrypt -fuzztime=60s

  web:
    name: Web
    # The frontend build is the same bytes on every platform, so one runner
    # settles it; the matrix above is there for the parts that touch a filesystem.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The end-to-end tests drive the real binary, so this job needs Go as well.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        # A rule that only warns is not a gate. Where an upstream warning fires on
        # something legitimate, exempt it in eslint.config.js with a written
        # reason, the way .golangci.yml does, rather than letting warnings through.
        run: npm run lint -- --max-warnings=0
      - name: Test with coverage
        # The reporter list belongs to vite.config.ts. Naming json-summary here
        # keeps the gate below working whatever that file prints for a developer.
        run: npm run test -- --coverage --coverage.reporter=text --coverage.reporter=json-summary
      - name: Enforce coverage gate
        run: |
          total=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t + 0 < 85) { print "coverage " t "% is below the 85% gate"; exit 1 } }'
      - name: Build
        run: npm run build
      - name: The committed viewer is what this source builds to
        # internal/viewer/dist is committed so the binary can embed it, which means it
        # can fall behind web/src without anything noticing: the Go tests would keep
        # passing against a viewer nobody is looking at any more. The build above has
        # just overwritten it, so anything git sees here is drift.
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain -- internal/viewer/dist)" ]; then
            echo "internal/viewer/dist does not match what web/src builds to."
            echo "Run: cd web && npm run build   — then commit the result."
            git status --porcelain -- internal/viewer/dist
            exit 1
          fi
          echo "in step with web/src"
      - name: Install a browser
        # Only the headless shell: the tests drive a page, they do not record video
        # or need a full browser install.
        run: npx playwright install --with-deps --only-shell chromium
      - name: Build the binary the browser talks to
        # The end-to-end tests run against the real program over a real archive,
        # which is the point of them: everything else runs in jsdom, and jsdom has
        # no layout, so it cannot tell whether a long conversation actually scrolls.
        working-directory: .
        run: go build -o amberkeep ./cmd/amberkeep
        env:
          CGO_ENABLED: 0
      - name: End to end
        run: npm run e2e
      - name: React Doctor
        # react-doctor has no minimum-score flag. Its own gate is --blocking, which
        # fires on the severity of what it finds, and that is what is used here.
        #
        # The score exists and is deliberately not used. It is computed by
        # react.doctor's API, --no-telemetry is an alias for --no-score, and so
        # there is no way to have the number without the request. What would leave
        # the machine is rule names and counts rather than code, and it would leave
        # from CI rather than from anybody's computer. It is still a request to
        # somebody else's server made by a project whose whole claim is that it
        # makes none, and the severity gate blocks on the same findings anyway.
        run: npm run doctor

  no-private-data:
    name: No private data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Real backups, keys and message databases must never reach this repository,
      # so the guard is mechanical rather than a matter of remembering.
      - name: Scan for backup and key material
        run: |
          if git ls-files | grep -Ei '\.(crypt1[245]|vcf)$|msgstore.*\.db$|ChatStorage.*\.sqlite|(^|/)(wa\.db|key\.txt)$'; then
            echo "private data must never be committed"
            exit 1
          fi
          echo "clean"
