name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Build
        run: go build ./...
        env:
          CGO_ENABLED: 0
      - name: Test with race detector
        run: go test ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic
      - name: Enforce coverage gate
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t + 0 < 85) { print "coverage " t "% is below the 85% gate"; exit 1 } }'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      # A short run on every change catches regressions in the parsers that read
      # untrusted files. Long campaigns run separately.
      - run: go test ./internal/crypt15/ -run=XXX -fuzz=FuzzDecrypt -fuzztime=60s

  no-private-data:
    name: No private data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Real backups, keys and message databases must never reach this repository,
      # so the guard is mechanical rather than a matter of remembering.
      - name: Scan for backup and key material
        run: |
          if git ls-files | grep -Ei '\.(crypt1[245]|vcf)$|msgstore.*\.db$|ChatStorage.*\.sqlite|(^|/)(wa\.db|key\.txt)$'; then
            echo "private data must never be committed"
            exit 1
          fi
          echo "clean"
