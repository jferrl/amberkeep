version: "2"

linters:
  default: none
  enable:
    - errcheck       # every returned error is handled or explicitly ignored
    - govet
    - staticcheck
    - ineffassign
    - unused
    - revive         # style, close to the Google Go Style Guide
    - gocritic
    - gosec          # this code handles keys and reads untrusted files
    - errorlint      # errors are compared with errors.Is/As, not ==
    - bodyclose
    - noctx          # every outbound request carries a context
    - nilerr
    - unconvert
    - misspell
    - predeclared
    - makezero
    - copyloopvar
    - durationcheck
    - errname        # sentinel errors are ErrX, error types are XError
    - exhaustive     # switches over enums are complete or explicitly default
    - contextcheck
    - forcetypeassert

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      # Closing a read-only handle reports nothing a caller could act on, and these
      # appear on cleanup paths where an earlier error is already being returned.
      # Anything whose Close verifies data, such as a decompressor, is still checked.
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (*database/sql.Stmt).Close
        - (*os.File).Close
        # The same read-only handle, one layer up: Reader.Close only wraps the
        # sql.DB.Close above, so checking it would report the same nothing twice.
        - (*github.com/jferrl/amberkeep/internal/source/android.Reader).Close
        - (*github.com/jferrl/amberkeep/internal/search.Index).Close
        - (github.com/jferrl/amberkeep/internal/source.Archive).Close
        - (github.com/jferrl/amberkeep/internal/api.Archive).Close
        # Letting go of the archive a server holds. It reports nothing a caller could
        # act on, and it is called on the way out of a command that is ending anyway.
        - (*github.com/jferrl/amberkeep/internal/api.Server).Close
        # Letting go of an iPhone store that was only ever read from. Same read-only
        # handle as the rest of this list.
        - (*github.com/jferrl/amberkeep/internal/migrate.Target).Close
        - (*github.com/jferrl/amberkeep/internal/backupfs.Archive).Close
        # Rolling back a transaction that already committed is how the deferred
        # cleanup is written; it reports ErrTxDone and means nothing went wrong.
        - (*database/sql.Tx).Rollback
        # A buffered writer records the first failure and reports it from Flush,
        # which every writer here checks. Testing each individual write would add
        # noise without catching anything the Flush does not.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*bufio.Writer).WriteString
        # Writing a response body after its status line has gone out. A failure
        # means the reader closed the page: there is no way left to report it and
        # nobody to report it to.
        - io.WriteString
        # Removing a temporary file on a path that is already returning an error.
        # There is nothing further to report and nothing a caller could do.
        - os.Remove
        # Abandoning a half-made copy of a backup on a path that is already failing.
        # Leaving it is the thing to avoid; failing to leave it is not worth a second
        # error on top of the first.
        - os.RemoveAll
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam        # readers legitimately take a Key by value
        - rangeValCopy
    gosec:
      excludes:
        - G401  # MD5 appears as the format's own integrity marker, never as a control
        - G501
        # Unchecked errors are errcheck's job, and it is configured far more
        # strictly than this check: it flags blank assignments too, and every
        # exemption is listed above with its reason. Two linters disagreeing about
        # the same rule only teaches people to ignore both.
        - G104
    revive:
      rules:
        - name: exported
          arguments: ["checkPrivateReceivers", "disableStutteringCheck"]
        - name: package-comments
        - name: error-strings
        - name: error-naming
        - name: context-as-argument
        - name: indent-error-flow
        - name: var-naming
        - name: early-return

  exclusions:
    rules:
      # Tests build deliberately malformed fixtures and may ignore errors that the
      # production path must not.
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - forcetypeassert
          # Fixture setup builds databases in a temporary directory; there is
          # nothing to cancel and threading a context through it adds noise.
          - noctx

      # Readers assemble their queries from the columns a database actually has,
      # because WhatsApp renames and removes them between releases. The interpolated
      # text always comes from sqlite_master or PRAGMA table_info on the file being
      # read, never from user input, and every value is still a bound parameter.
      # That is the version-tolerance design, so the warning is expected here and
      # nowhere else.
      - path: internal/source/
        text: "G201|G202|G70[0-9]"
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jferrl/amberkeep

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
